name: verification
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 cppcheck clang-tidy
          pip install pytest
      - name: Build, test, coverage, static analysis
        run: make all
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            */build/*.gcov
            */build/integration-report.xml
            03-static-analysis-code-review/reports/
